<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4332" />
      <stop offset="100%" stop-color="#0F291E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C87A" />
      <stop offset="100%" stop-color="#E8A33D" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card / Circle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Gold Decorative Accent Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.3" stroke-dasharray="12 8" />

  <!-- Main Eye Shape Container -->
  <g filter="url(#shadow)">
    <!-- Eye White / Iris Glow -->
    <path d="M 96 256 C 160 160, 352 160, 416 256 C 352 352, 160 352, 96 256 Z" fill="#FBF7EF" />
    
    <!-- Outer Iris (Brique Accent) -->
    <circle cx="256" cy="256" r="76" fill="#B8442C" />
    
    <!-- Inner Pupil (Deep Green) -->
    <circle cx="256" cy="256" r="46" fill="#0F291E" />
    
    <!-- Gold Pupil Center Glow -->
    <circle cx="256" cy="256" r="22" fill="url(#goldGrad)" />
    
    <!-- Light Reflection Highlight -->
    <circle cx="236" cy="236" r="12" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
